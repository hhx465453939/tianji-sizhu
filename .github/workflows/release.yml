# ============================================================
# TianJi-SiZhu Release Pipeline
# ============================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"
  APP_NAME: "tianji-sizhu"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify tools
        shell: bash
        run: |
          echo "Go: $(go version)"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "GOPATH: $(go env GOPATH)"
          echo "PATH: $PATH"
          wails version || echo "WARN: wails not in PATH yet"
          which wails || echo "WARN: which wails failed"

      - name: Build
        shell: bash
        run: |
          wails build -platform windows/amd64 -nsis
          echo "=== build/bin contents ==="
          ls -la build/bin/ || echo "build/bin not found"

      - name: Find installer
        id: find
        shell: bash
        run: |
          echo "=== Looking for installer ==="
          find build/bin -type f -name "*.exe" | head -10
          INSTALLER=$(find build/bin -type f -name "*installer*" | head -1)
          if [ -z "$INSTALLER" ]; then
            INSTALLER=$(find build/bin -type f -name "*.exe" | head -1)
          fi
          echo "installer_path=$INSTALLER" >> $GITHUB_OUTPUT
          echo "Selected: $INSTALLER"

      - name: Upload
        if: steps.find.outputs.installer_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.find.outputs.installer_path }}

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          echo "Go: $(go version)"
          echo "Node: $(node --version)"
          wails version

      - name: Build
        run: |
          wails build -platform darwin/universal
          echo "=== build/bin contents ==="
          ls -la build/bin/

      - name: Create DMG
        run: |
          ls -la build/bin/
          mkdir -p dmg-staging
          cp -r "build/bin/${{ env.APP_NAME }}.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "TianJi-SiZhu" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "build/bin/${{ env.APP_NAME }}-darwin-universal.dmg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/bin/${{ env.APP_NAME }}-darwin-universal.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          echo "Go: $(go version)"
          echo "Node: $(node --version)"
          wails version

      - name: Build
        run: |
          wails build -platform linux/amd64
          echo "=== build/bin contents ==="
          ls -la build/bin/

      - name: Package tar.gz
        run: |
          cd build/bin
          tar czf "${{ env.APP_NAME }}-linux-amd64.tar.gz" "${{ env.APP_NAME }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: |
            build/bin/${{ env.APP_NAME }}-linux-amd64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    env:
      TIANJI_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build web bundle
        working-directory: frontend
        run: pnpm build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Project-local debug keystore
        run: |
          mkdir -p "$TIANJI_ROOT/.android/home"
          keytool -genkeypair -v \
            -keystore "$TIANJI_ROOT/.android/home/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble release APKs
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2
          ls -la app/build/outputs/apk/release/

      - name: Name artifacts
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          mkdir -p release-assets
          for apk in frontend/android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            abi=$(echo "$base" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "release-assets/tianji-sizhu-${VERSION}-android-${abi}.apk"
          done
          ls -la release-assets/

      - name: Verify APK metadata
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT" dump badging release-assets/*universal*.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-assets/*.apk

  publish-release:
    needs: [build-windows, build-macos, build-linux, build-android]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV" ]; then
            CHANGES=$(git log --oneline --no-decorate | head -50)
          else
            CHANGES=$(git log --oneline --no-decorate "${PREV}..HEAD")
          fi
          {
            echo "## TianJi-SiZhu ${TAG}"
            echo ""
            echo "Open-source BaZi desktop client."
            echo ""
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows | *.exe |"
            echo "| macOS | *.dmg |"
            echo "| Linux | *.tar.gz |"
            echo "| Android (arm64-v8a) | *-android-arm64-v8a.apk |"
            echo "| Android (armeabi-v7a) | *-android-armeabi-v7a.apk |"
            echo "| Android (x86_64) | *-android-x86_64.apk |"
            echo "| Android (universal) | *-android-universal.apk |"
            echo ""
            echo "> Android APKs are signed with the project debug key unless a release keystore is configured. Install via \"unknown sources\"."
            echo ""
            echo "### Commits"
            echo "$CHANGES"
          } > changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TianJi-SiZhu ${{ github.ref_name }}"
          body_path: changelog.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.tar.gz
            release-assets/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
