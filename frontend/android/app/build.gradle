apply plugin: 'com.android.application'

// --- version single source of truth (frontend/package.json) -------------
def pkg = new groovy.json.JsonSlurper().parseText(file('../../package.json').text)
def versionParts = pkg.version.tokenize('.').collect { it as int }
def computedVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// --- signing: CI-provided keystore, otherwise a project-local debug key --
// AGP defaults to "$HOME/.android/debug.keystore", which would escape the repo.
// TIANJI_ROOT is exported by scripts/android-env.sh.
def tianjiRoot = System.getenv("TIANJI_ROOT")
def localDebugKeystore = tianjiRoot ? file("${tianjiRoot}/.android/home/debug.keystore") : null
def ciKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasCiKeystore = ciKeystorePath != null && !ciKeystorePath.trim().isEmpty()

android {
    namespace = "com.tianjisizhu.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.tianjisizhu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Skip VCS and OS cruft inside the packaged web assets.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasCiKeystore) {
            release {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
        if (localDebugKeystore != null) {
            debug {
                storeFile localDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    // One install package per mainstream ABI + a universal fallback.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasCiKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
